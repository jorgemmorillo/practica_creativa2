apiVersion: v1
kind: Service
metadata:
  name: details-svc
  namespace: cdps-27
  labels:
    app: details
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: details
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: details
  namespace: cdps-27
  labels:
    app: details
spec:
  replicas: 4
  selector:
    matchLabels:
      app: details
  template:
    metadata:
      labels:
        app: details
    spec:
      containers:
      - name: details
        image: gcr.io/pcreativa2-485818/details:g27
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9080
